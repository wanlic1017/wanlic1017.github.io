<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>

    <script>
      // Store the current path
      sessionStorage.redirect =
        location.pathname + location.search + location.hash;

      // Redirect to root
      window.location.replace("/");
    </script>
  </head>
  <body></body>
</html>
