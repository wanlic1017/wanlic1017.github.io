  <noscript><h1>HaerengaNZ Study Packages</h1>
      <p>Independent HUBS191 and CELS191 revision resources for HSFY students at the University of Otago.
      Choose the package that fits how you study.</p>
      <p>Includes 2,700+ checked questions across HUBS191 and CELS191, with a 300-question
      daily production pipeline feeding reviewed updates for the question hub.</p>
      <h2>Plans</h2>
      <ul>
        <li>Free — 20 practice questions per day across HUBS191 and CELS191.</li>
        <li>Practice Pro — NZ$9.99/month. Unlimited daily questions, all modules, answer explanations. 1-day free trial.</li>
        <li>Everything — NZ$88 one-time. Notes, model answers, mind maps, and unlimited practice for all 10 modules.</li>
      </ul>
      <h2>Which plan should I choose?</h2>
      <ul>
        <li>Choose Practice Pro if you mainly want unlimited question practice and explanations.</li>
        <li>Choose Everything if you want notes, model answers, mind maps, and question practice together.</li>
        <li>Choose one module if you only need focused support for a single topic.</li>
      </ul>
      <h2>Question quality checks</h2>
      <p>New question batches are checked for exact duplicates, high-similarity repeats,
      answer structure, and subject/module routing before upload.</p>
      <h2>Individual modules</h2>
      <p>Buy one module at a time from NZ$8. Includes notes, model answers, and mind map where available.</p>
      <p>Independent platform — not affiliated with or endorsed by the University of Otago.</p></noscript>
