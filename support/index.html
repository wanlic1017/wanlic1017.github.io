  <noscript><h1>HaerengaNZ Support</h1>
      <p>Having trouble with access, a payment, or something else? Here is how to get help.</p>
      <h2>Access or login issues</h2>
      <p>If you paid but your account still shows the free tier, sign out and sign back in,
      make sure you used the same email at checkout, wait 2–3 minutes, then try refreshing.
      If that doesn't work, email wanlic1017@gmail.com.</p>
      <h2>Refund requests</h2>
      <p>Email wanlic1017@gmail.com with your purchase email, what you bought, and a brief
      description of the issue. Refunds are reviewed in good faith and in line with New Zealand
      consumer protection law.</p>
      <h2>Other questions</h2>
      <p>Email wanlic1017@gmail.com for billing, content, or general questions.</p>
