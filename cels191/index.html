  <noscript><h1>CELS191 Cells and Molecular Biology — Study Resources</h1>
      <p>Independent revision resources for CELS191 at the University of Otago.
      Practice questions updated daily, structured lecture notes, model answers,
      and interactive mind maps — organised by module for HSFY students.</p>
      <h2>Modules</h2>
      <ul>
        <li>Cell Structure &amp; Diversity — cell architecture, membranes, organelles, prokaryote vs eukaryote</li>
        <li>Molecular Biology &amp; Genetics — DNA, gene expression, inheritance, molecular tools</li>
        <li>Human Molecular Genetics — genetic variation, mutation, inheritance patterns, disease</li>
        <li>Microbiology — microbial structure, growth, genetics, bacteria and viruses</li>
      </ul>
      <p>Independent platform — not affiliated with or endorsed by the University of Otago.</p></noscript>
